- serve_id: qwen_gr00t_vla
  engine_args:
    host: 0.0.0.0
    port: 5000
    model_variant: QwenGr00t
    model: /workspace/models/qwen_gr00t_train/checkpoints/last # Replace with the actual checkpoint path.
    device: "cuda"
    image_hw: [224, 224]
    protocol:
      env_name: starvla_sim
      image_key: observation/image
      wrist_image_key: observation/wrist_image
      state_key: observation/state
      prompt_key: prompt
      actions_key: actions
    rename_map:
      observation.image: observation.images.image
      observation.wrist_image: observation.images.wrist_image
      observation.state: observation.state
    task_key: task

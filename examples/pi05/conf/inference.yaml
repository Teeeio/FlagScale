defaults:
  - _self_
  - inference: pi05

experiment:
  exp_name: pi05
  exp_dir: outputs/${experiment.exp_name}
  task:
    type: inference
    backend: vllm
    entrypoint: flagscale/inference/embodied_entrypoint_pi05.py
  runner:
    hostfile: null
  envs:
    CUDA_DEVICE_MAX_CONNECTIONS: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
